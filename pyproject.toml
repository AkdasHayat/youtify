[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtify"
version = "1.0.0"
description = "Local, free automation: YouTube channel videos on your Mac -> Spotify video podcast drafts with AI-written metadata."
requires-python = ">=3.10"
dependencies = [
  "yt-dlp>=2025.1.1",
  "playwright>=1.45",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
whisper = ["mlx-whisper>=0.4"]
dev = ["pytest>=8"]

[project.scripts]
youtify = "youtify.cli:main"

[tool.setuptools]
packages = ["youtify"]

[tool.setuptools.package-data]
youtify = ["*.yaml"]
